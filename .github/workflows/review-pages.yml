name: Publish CareFlow review demo
on:
  push:
    branches: [codex/careflow-workspace]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: careflow-review-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build-review-demo.mjs
      - name: Locate review export
        id: export
        run: echo "path=$(cat .pages-review-output)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.export.outputs.path }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy review demo
        id: deployment
        uses: actions/deploy-pages@v4
