<title>Wardwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark slate rail on the left, scrolling workspace on the right, inspector slides over the workspace so context is never lost. */
:root{
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#F6F8FA; --line:#E0E5EB; --line-strong:#C9D1DA;
  --fg:#13202C; --fg-2:#485766; --fg-3:#738190;
  --accent:#2A57D6; --accent-fg:#FFFFFF; --accent-soft:#E6ECFC;
  --good:#17803F; --good-soft:#E2F3E8; --warn:#8F5A00; --warn-soft:#FBEED2; --bad:#B3261B; --bad-soft:#FCE5E2;
  --side:#111A23; --side-2:#1A2530; --side-fg:#C5D0DB; --side-dim:#7B8999; --side-line:#26323E;
  --toast:#13202C; --toast-fg:#F1F5F9; --scrim:rgba(11,18,25,.45);
  --shadow:0 12px 40px rgba(10,20,30,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1117; --surface:#121A22; --surface-2:#17212B; --line:#223040; --line-strong:#32455A;
  --fg:#E5EBF1; --fg-2:#A7B4C1; --fg-3:#79879A;
  --accent:#7D9CFF; --accent-fg:#0B1117; --accent-soft:#1A2646;
  --good:#4FC47F; --good-soft:#0F2F1E; --warn:#E6AC3E; --warn-soft:#38290B; --bad:#FF7F70; --bad-soft:#401812;
  --side:#0A1017; --side-2:#131D27; --side-fg:#C5D0DB; --side-dim:#6F7D8D; --side-line:#1E2A36;
  --toast:#E5EBF1; --toast-fg:#0B1117; --scrim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1117; --surface:#121A22; --surface-2:#17212B; --line:#223040; --line-strong:#32455A;
  --fg:#E5EBF1; --fg-2:#A7B4C1; --fg-3:#79879A;
  --accent:#7D9CFF; --accent-fg:#0B1117; --accent-soft:#1A2646;
  --good:#4FC47F; --good-soft:#0F2F1E; --warn:#E6AC3E; --warn-soft:#38290B; --bad:#FF7F70; --bad-soft:#401812;
  --side:#0A1017; --side-2:#131D27; --side-fg:#C5D0DB; --side-dim:#6F7D8D; --side-line:#1E2A36;
  --toast:#E5EBF1; --toast-fg:#0B1117; --scrim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:22px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:15px;font-weight:600;letter-spacing:-.005em}
h3{font-size:13px;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:15px;height:15px}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--fg-3)} .dim2{color:var(--fg-2)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--fg-3);background:var(--surface-2)}

.app{display:grid;grid-template-columns:244px minmax(0,1fr);height:100%}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:20px;padding:16px 12px;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;color:#fff;font-weight:600;font-size:15px;letter-spacing:.01em}
.mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--side-2);border:1px solid var(--side-line);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--side-dim);height:28px;border-radius:5px;font-size:12.5px;font-weight:500}
.seg button.on{background:var(--side);color:#fff;box-shadow:0 0 0 1px var(--side-line)}
.qs{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:7px;background:var(--side-2);border:1px solid var(--side-line);color:var(--side-dim);width:100%;text-align:left}
.qs span{flex:1}
.qs kbd{background:transparent;border-color:var(--side-line);color:var(--side-dim)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--side-dim);padding:0 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;background:transparent;border-radius:6px;color:var(--side-fg);text-align:left;font-weight:500}
.nav button:hover{background:var(--side-2)}
.nav button.on{background:var(--side-2);color:#fff}
.nav button.on .i{color:var(--accent)}
.nav .ct{margin-left:auto;font-size:11.5px;font-weight:600;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--bad);color:#fff;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.nav .ct.n{background:var(--side-line);color:var(--side-fg)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--side-dim);padding:0 8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.dot.busy{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.who{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--side-line);font-size:12.5px}
.who b{display:block;color:#fff;font-weight:600}
.who small{color:var(--side-dim);font-size:12px}
.av{width:30px;height:30px;border-radius:50%;background:var(--side-2);border:1px solid var(--side-line);display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.top .crumb{font-size:12.5px;color:var(--fg-3)}
.ib.menu{display:none}
.hseg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;max-width:100%;overflow-x:auto}
.hseg button{border:0;background:transparent;height:28px;padding:0 12px;border-radius:5px;font-size:12.5px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.hseg button.on{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line-strong)}
.content{flex:1;overflow-y:auto;padding:24px 28px 64px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph p{color:var(--fg-2);margin-top:4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ib{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--fg-2)}
.ib:hover{background:var(--surface-2);border-color:var(--line);color:var(--fg)}
.acts{display:inline-flex;gap:2px;align-items:center;justify-content:flex-end}

.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.nd::before{display:none}
.tag.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.proc::before{width:10px;height:10px;background:none;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--fg-2)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);text-align:left;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface-2)}
tr.drag td{background:var(--accent-soft)}
td.r,th.r{text-align:right}
.cell2{display:flex;flex-direction:column;gap:2px;min-width:0}
.cell2 small{color:var(--fg-3);font-size:12px}
.who2{display:flex;align-items:center;gap:10px}
.av2{width:30px;height:30px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:12px;flex:none}
.fields{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.fields span{font-size:11.5px;font-weight:600;color:var(--bad);background:var(--bad-soft);padding:1px 6px;border-radius:3px}

.stat .big{font-size:34px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .big small{font-size:16px;color:var(--fg-3);font-weight:500;margin-left:2px}
.stat .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--fg-2);padding:5px 0;border-top:1px solid var(--line)}
.stat .big{margin-bottom:12px}
.meter{position:relative;height:8px;border-radius:4px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.meter .f{position:absolute;inset:0 auto 0 0;width:calc(var(--v)*1%);border-radius:4px;background:var(--c);transition:width .7s cubic-bezier(.2,.7,.2,1)}
.meter i{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--fg-3);opacity:.7}
.meter.good{--c:var(--good)} .meter.warn{--c:var(--warn)} .meter.bad{--c:var(--bad)}
.mrow{display:grid;grid-template-columns:150px minmax(0,1fr) 38px;gap:12px;align-items:center;font-size:12.5px;color:var(--fg-2)}
.mrow .meter{height:6px}
.hc{display:flex;flex-direction:column;gap:14px}
.hc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hc .score{font-size:38px;font-weight:600;letter-spacing:-.025em;line-height:1;font-variant-numeric:tabular-nums}
.hc .score small{font-size:16px;color:var(--fg-3);margin-left:1px}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--fg-3);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:1px;height:12px;background:var(--fg-3)}

.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .ico{width:28px;height:28px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.feed .ico.g{background:var(--good-soft);color:var(--good)} .feed .ico.w{background:var(--warn-soft);color:var(--warn)} .feed .ico.b{background:var(--bad-soft);color:var(--bad)}
.feed p{font-size:13px}
.feed small{color:var(--fg-3);font-size:12px}
.att{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.att:last-child{border-bottom:0}
.att:hover{background:var(--surface-2)}
.att .sev{align-self:stretch;border-radius:2px;background:var(--warn)}
.att .sev.b{background:var(--bad)}
.att b{font-weight:600;font-size:13px;display:block}
.att small{color:var(--fg-3);font-size:12px}

.dz{border:1.5px dashed var(--line-strong);border-radius:10px;padding:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface)}
.dz.over{border-color:var(--accent);background:var(--accent-soft)}
.dz .ic{width:40px;height:40px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.dz .t{flex:1;min-width:220px}
.dz .t small{display:block;color:var(--fg-3);margin-top:2px}

.mx td,.mx th{padding:9px 12px}
.mx td.c{text-align:center}
.cellst{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.cellst.good{color:var(--good)} .cellst.warn{color:var(--warn)} .cellst.bad{color:var(--bad)} .cellst.na{color:var(--fg-3);font-weight:400}
.dis{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dis:last-child{border-bottom:0}
.dis b{font-size:13px;display:block}
.dis p{font-size:12.5px;color:var(--fg-2);margin-top:2px}
.dis .fix{margin-top:6px;font-size:12.5px;display:flex;gap:6px;align-items:flex-start;color:var(--fg)}
.dis .fix .i{color:var(--accent);margin-top:2px}
.syncbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 10px 10px;flex-wrap:wrap}
.rlist{display:flex;flex-direction:column}
.rlist button{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.rlist button:last-child{border-bottom:0}
.rlist button:hover{background:var(--surface-2)}
.rlist button.on{background:var(--accent-soft)}

.insp{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .22s cubic-bezier(.2,.7,.2,1),visibility 0s .22s}
.insp.open{transform:none;visibility:visible;transition:transform .22s cubic-bezier(.2,.7,.2,1)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:35;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.scrim.on{opacity:1;visibility:visible;transition:opacity .2s}
.insp-h{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.insp-h .grow{flex:1;min-width:0}
.insp-b{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -18px;padding:0 18px}
.tabs button{border:0;background:transparent;height:36px;padding:0 10px;font-weight:500;color:var(--fg-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--fg-3)} .kv dd{margin:0}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
.list>div:last-child{border-bottom:0}
.paper{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);padding:16px;display:flex;flex-direction:column;gap:8px;max-width:320px}
.paper b{font-size:12px;font-family:var(--mono);font-weight:500;color:var(--fg-2)}
.paper .ln{height:5px;border-radius:3px;background:var(--line-strong)}
.paper .blk{border:1.5px solid var(--good);border-radius:4px;padding:6px 8px;font-size:11.5px;font-weight:600;color:var(--good);background:var(--good-soft)}
.paper .blk.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft);border-style:dashed}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}

.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:70;width:min(380px,calc(100% - 32px))}
.toast{display:flex;align-items:center;gap:10px;background:var(--toast);color:var(--toast-fg);padding:10px 12px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;animation:rise .22s cubic-bezier(.2,.7,.2,1)}
.toast span{flex:1;min-width:0}
.toast button{border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;padding:2px 4px}
.toast .i{flex:none}

.pal{position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.pal-box{width:min(600px,100%);background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 14px;height:50px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;border:0;outline:0;background:transparent;font-size:15px;min-width:0}
.pal-list{max-height:min(380px,50vh);overflow-y:auto;padding:6px}
.pal-g{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);padding:8px 10px 4px}
.pal-i{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px}
.pal-i.on{background:var(--accent-soft)}
.pal-i small{color:var(--fg-3)}
.pal-empty{padding:24px;text-align:center;color:var(--fg-3)}

.phone{width:340px;max-width:100%;border:1px solid var(--line-strong);border-radius:30px;background:var(--surface);padding:10px;margin:0 auto}
.screen{border-radius:22px;background:var(--bg);display:flex;flex-direction:column;height:520px;overflow:hidden}
.ph-h{padding:14px 16px;background:var(--side);color:#fff;display:flex;align-items:center;gap:10px}
.ph-h small{color:var(--side-dim);display:block;font-size:11.5px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13px;white-space:pre-line}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:3px}
.msg.b{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px}
.src{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.src span{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent)}
.ph-f{padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface);border-top:1px solid var(--line)}
.ph-f .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.ph-f .chip{white-space:nowrap;flex:none;height:26px;font-size:12px}
.ph-f form{display:flex;gap:8px}
.ph-f input{flex:1;min-width:0;height:34px;border-radius:17px;border:1px solid var(--line-strong);background:var(--bg);padding:0 14px}

.mar{border-collapse:separate;border-spacing:0;font-size:12px;width:max-content;min-width:100%}
.mar th,.mar td{padding:0;height:30px;text-align:center;border-bottom:1px solid var(--line);background:var(--surface)}
.mar th{font-size:11px;font-weight:600;color:var(--fg-3);background:var(--surface-2);letter-spacing:0;text-transform:none;min-width:26px}
.mar th:first-child,.mar td:first-child{position:sticky;left:0;z-index:1;text-align:left;padding:0 12px;min-width:200px;border-right:1px solid var(--line)}
.mar th:first-child{background:var(--surface-2);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}
.mc i{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle}
.mc.g i{background:var(--good)}
.mc.r{color:var(--bad);font-weight:700} .mc.h{color:var(--warn);font-weight:700} .mc.n{color:var(--fg-3)}
.mc.x i{width:11px;height:11px;border-radius:2px;border:1.5px dashed var(--bad);background:var(--bad-soft)}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--fg-2)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--good)}
.key i.x{width:11px;height:11px;border-radius:2px;border:1.5px dashed var(--bad);background:var(--bad-soft)}
.tl{list-style:none;margin:0;padding:0 16px 6px}
.tl li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.tl li:last-child{border-bottom:0}
.tl time{color:var(--fg-3);font-size:12px;padding-top:1px}
.tl small{display:block;color:var(--fg-3);font-size:12px}
.tl .b{color:var(--bad);font-weight:500}
.prof{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.tour{position:fixed;left:260px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);z-index:60;padding:16px;display:flex;flex-direction:column;gap:10px}
.tour p{color:var(--fg-2);font-size:13px}
.tour .bar{display:flex;gap:4px}
.tour .bar i{flex:1;height:3px;border-radius:2px;background:var(--line-strong)}
.tour .bar i.on{background:var(--accent)}
.tour .btns{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1000px){.cols,.prof{grid-template-columns:minmax(0,1fr)!important}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:264px;z-index:50;transform:translateX(-100%);transition:transform .22s}
  .side.open{transform:none}
  .ib.menu{display:inline-grid}
  .top{padding:10px 16px}
  .content{padding:18px 16px 64px}
  .mrow{grid-template-columns:110px minmax(0,1fr) 34px}
  .tour{left:16px}
}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const sched=m=>{const q=m.split(' · ')[1]||'';return /PRN/.test(q)?['As needed']:/TID/.test(q)?['8:00 AM','2:00 PM','8:00 PM']:/BID/.test(q)?['8:00 AM','8:00 PM']:/bedtime|PM|HS/i.test(q)?['9:00 PM']:['8:00 AM']};
const MAR={};
RES.forEach((r,ri)=>{
  const rnd=mulberry(1000+ri*17),tr=track.find(t=>t.res===r.id&&t.type==='MAR');
  const gap=tr.st==='missing'?7:tr.st==='rejected'?4:0,gd=new Set();
  while(gd.size<gap)gd.add(1+Math.floor(rnd()*30));
  const pr=r.flags.includes('Medication refusal')?.1:.012;
  MAR[r.id]=[];
  r.meds.forEach(m=>sched(m).forEach(tm=>{
    const days=[];
    for(let d=1;d<=30;d++){
      if(tm==='As needed'){days.push(rnd()<.1?'g':'-');continue}
      if(gd.has(d)&&rnd()<.75){days.push('x');continue}
      const q=rnd();days.push(q<pr?'r':q<pr+.012?'h':'g');
    }
    MAR[r.id].push({med:m.split(' · ')[0],time:tm,days});
  }));
});

function gate(row,fileName){
  row.prev=row.st==='processing'?row.prev:row.st;row.st='processing';row.stage='Reading text (OCR)';render();
  setTimeout(()=>{row.stage='Checking signature blocks';render()},700);
  setTimeout(()=>{row.stage='Matching document type';render()},1300);
  setTimeout(()=>{
    const det=detectType(fileName),r=resOf(row.res);let fields=[];
    if(!/\.pdf$/i.test(fileName))fields=['File is not a PDF'];
    else if(det&&det!==row.type)fields=[`Reads as ${det}, row expects ${row.type}`];
    else if(isBad(fileName))fields=['Staff signature (p.2)','Date of review'];
    if(fields.length){
      row.st='rejected';row.file=fileName;row.fields=fields;
      act('Gatekeeper',`Rejected ${row.type} for Resident ${row.res}. ${fields.join(', ')}.`,'b','alert');
      toast(`Rejected: ${row.type} for ${row.res}. ${fields[0]}`,{icon:'alert',action:{label:'View',fn:()=>openIns({kind:'doc',id:row.id})}});
    }else{
      row.st='verified';row.ver++;row.file=fileName;row.fields=[];row.upd=new Date(TODAY);row.by='Facility staff';
      row.vers.unshift({v:row.ver,date:new Date(TODAY),by:'Facility staff',note:'Passed gatekeeper'});
      act('Gatekeeper',`Verified ${row.type} for Resident ${row.res}. Signatures and dates complete.`,'g','check');
      toast(`Verified: ${row.type} for ${row.res}`);
    }
    row.stage='';render();
  },1900);
}

function handleFile(file,tg){
  const name=file.name;

  if(tg&&tg.kind==='care'){gateCare(tg.id,tg.i,name);return}
  const det=detectType(name);
  if(!det){toast('Gatekeeper could not tell the document type. Rename with MAR, ONA or Safety.',{icon:'alert'});return}
  const rows=trackRows().filter(t=>t.type===det);

  gate(hit||row,name);
}

  if(c.st==='m')return `<button class="btn sm pri" data-act="care-upload" data-id="${rid}" data-i="${i}">${ic('upload','s')}Upload</button>`;
  return `<span class="acts"><button class="ib" data-act="care-upload" data-id="${rid}" data-i="${i}" aria-label="Replace file" title="Replace file">${ic('replace','s')}</button><button class="ib" data-act="care-hist" data-id="${rid}" data-i="${i}" aria-label="Version history" title="Version history">${ic('history','s')}</button><button class="ib" data-act="care-arch" data-id="${rid}" data-i="${i}" aria-label="Archive" title="Archive">${ic('archive','s')}</button></span>`;

function trkStatus(t){
  if(t.st==='processing')return tag('info',t.stage||'Processing PDF…','proc');
  if(t.st==='verified')return tag('good','Verified');
  if(t.st==='rejected')return tag('bad','Rejected');
  return tag('warn','Not uploaded');
}

const credCell=c=>{const t=c.d<0?['bad',`Expired ${-c.d}d ago`]:c.d<=7?['bad',`${c.d}d left`]:c.d<=30?['warn',`${c.d}d left`]:['good',`${c.d}d left`];return `<div class="cell2"><span class="mono">${fmtS(addD(c.d))}, ${addD(c.d).getFullYear()}</span><span>${tag(t[0],t[1])}</span></div>`};

function matrixCell(r,risk,di){
  if(care[r.id][di].st==='m')return `<td class="c"><span class="cellst na">No file</span></td>`;
  const d=r.d.find(x=>!x.done&&x.risk===risk);
  if(!d)return `<td class="c"><span class="cellst good">${ic('check','s')}Aligned</span></td>`;
  const dn=DOCS[di];
  if(d.docs[0]===dn)return `<td class="c"><span class="cellst good">${ic('check','s')}Source</span></td>`;
  if(d.docs.includes(dn))return d.kind==='conf'?`<td class="c"><span class="cellst bad">${ic('alert','s')}Conflict</span></td>`:`<td class="c"><span class="cellst warn">${ic('alert','s')}Missing</span></td>`;
  return `<td class="c"><span class="cellst good">${ic('check','s')}Aligned</span></td>`;
}

function findings(){
  const f=[];
  STAFF.filter(s=>scope(s.h)).forEach(s=>s.cr.forEach(c=>{if(c.d<0)f.push({sev:'Critical',h:s.h,t:`${s.name}: ${c.k} expired ${-c.d} days ago`,w:'Staff credentials',a:{kind:'staff',id:s.id}})}));
  trackRows().forEach(t=>{if(t.st==='missing')f.push({sev:'High',h:resOf(t.res).h,t:`${t.type} not on file for Resident ${t.res}`,w:'Monthly tracking',a:{kind:'doc',id:t.id}});if(t.st==='rejected')f.push({sev:'High',h:resOf(t.res).h,t:`${t.type} for Resident ${t.res} rejected: ${t.fields[0]}`,w:'Monthly tracking',a:{kind:'doc',id:t.id}})});
  RES.filter(r=>scope(r.h)).forEach(r=>{if(openDisc(r))f.push({sev:openDisc(r)>=4?'High':'Medium',h:r.h,t:`${openDisc(r)} risk discrepancies across care documents for Resident ${r.id}`,w:'Risk consistency',a:{kind:'res',id:r.id,tab:'risks'}});care[r.id].forEach((c,i)=>{if(c.st==='m')f.push({sev:'High',h:r.h,t:`${DOCS[i]} missing for Resident ${r.id}`,w:'Care documents',a:{kind:'res',id:r.id,tab:'files'}});if(c.st==='d')f.push({sev:'Medium',h:r.h,t:`${DOCS[i]} review overdue for Resident ${r.id}`,w:'Care documents',a:{kind:'res',id:r.id,tab:'files'}})})});
  const o={Critical:0,High:1,Medium:2};return f.sort((a,b)=>o[a.sev]-o[b.sev]);
}

function marGrid(rid){
  const nm={g:'Given',r:'Refused',h:'Held',x:'Not documented',n:'Not needed'};
  const head=`<tr><th>Medication and time</th>${Array.from({length:30},(_,i)=>`<th>${i+1}</th>`).join('')}</tr>`;
  const body=MAR[rid].map(row=>`<tr><td><div class="cell2"><b style="font-weight:600">${esc(row.med)}</b><small>${esc(row.time)}</small></div></td>${row.days.map((c,i)=>{const k=c==='-'?'n':c;return `<td class="mc ${k}" title="Sep ${i+1}, ${esc(row.time)}: ${nm[k]}">${k==='g'||k==='x'?'<i></i>':k==='r'?'R':k==='h'?'H':'·'}</td>`}).join('')}</tr>`).join('');
  return `<div class="tw"><table class="mar"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function insDoc(x){
  const t=track.find(q=>q.id===x.id),ok=t.st==='verified',bad=t.st==='rejected';
  const checks=t.st==='missing'?'':[['Document type',!bad||!t.fields.some(f=>/Reads as|PDF/.test(f))],['Signature block',!(bad&&t.fields.some(f=>/signature/i.test(f)))],['Dates present',!(bad&&t.fields.some(f=>/date/i.test(f)))],['Legible scan',true]];
  return insHead(`<span class="av2" style="width:38px;height:38px">${t.res}</span>`,`${t.type}, Resident ${t.res}`,`${H[resOf(t.res).h]} · September 2026`,trkStatus(t))+
  `<div class="insp-b">${t.st==='missing'?`<div class="list"><div>No file uploaded. Due Oct 5.</div></div><button class="btn pri" data-act="trk-upload" data-id="${t.id}">${ic('upload','s')}Upload PDF</button>`:`
  <div><div class="eyebrow" style="margin-bottom:8px">Gatekeeper result</div>${checks.map(([l,p])=>`<div class="chk">${ic(p?'check':'x','s').replace('class="i s"',`class="i s" style="color:var(--${p?'good':'bad'})"`)}<span>${l}</span><span style="margin-left:auto">${p?tag('good','Pass','nd'):tag('bad','Fail','nd')}</span></div>`).join('')}</div>
  <div class="paper"><b>${esc(t.file||'')}</b><span class="ln" style="width:90%"></span><span class="ln" style="width:70%"></span><span class="ln" style="width:82%"></span><div class="blk ${bad&&t.fields.some(f=>/signature/i.test(f))?'bad':''}">${bad&&t.fields.some(f=>/signature/i.test(f))?'Staff signature missing':'Staff signature found'}</div><div class="blk ${bad&&t.fields.some(f=>/date/i.test(f))?'bad':''}">${bad&&t.fields.some(f=>/date/i.test(f))?'Review date missing':'Review date found'}</div></div>
  <div><div class="eyebrow" style="margin-bottom:8px">Versions</div><div class="list">${t.vers.length?t.vers.map(v=>`<div><div class="cell2"><b>v${v.v}</b><small>${v.note}</small></div><span class="dim2">${fmt(v.date)} · ${v.by}</span></div>`).join(''):'<div class="dim2">No accepted versions yet</div>'}</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="trk-upload" data-id="${t.id}">${ic('replace','s')}Replace file</button><button class="btn" data-act="trk-arch" data-id="${t.id}">${ic('archive','s')}Archive</button></div>`}</div>`;
}
function insHist(x){
  let title,sub,vers,note='';
  if(x.src==='care'){const c=care[x.id][x.i];title=`${DOCS[x.i]} history`;sub=`Resident ${x.id}`;vers=c.vers}
  else{const t=track.find(q=>q.id===x.id);title=`${t.type} history`;sub=`Resident ${t.res}`;vers=t.vers}
  return insHead(ic('history'),title,sub)+`<div class="insp-b"><div class="list">${vers.length?vers.map((v,k)=>`<div><div class="cell2"><b>v${v.v} ${k===0?tag('good','Current','nd'):''}</b><small>${v.note} · ${v.by}</small></div><span style="display:flex;gap:10px;align-items:center"><span class="dim2">${fmt(v.date)}</span>${k?`<button class="btn sm" data-act="restore" data-v="${v.v}">Restore</button>`:''}</span></div>`).join(''):'<div class="dim2">No versions yet</div>'}</div></div>`;
}
function insQ(x){
  const q=QUEUE.find(a=>a.id===x.id);if(!q){state.ins=null;return ''}
  return insHead(`<span class="av2" style="width:38px;height:38px">${q.res}</span>`,`${q.type}, Resident ${q.res}`,`${q.client} · ${q.house}`,tag(q.conf>=90?'good':q.conf>=82?'warn':'bad',q.conf+'% confidence','nd'))+
  `<div class="insp-b"><p>${esc(q.text)}</p><div class="list">${q.detail.map(d=>`<div>${esc(d)}</div>`).join('')}</div>
  <div style="display:flex;gap:8px"><button class="btn pri" data-act="approve" data-id="${q.id}">${ic('check','s')}Approve and deploy</button><button class="btn" data-act="reject" data-id="${q.id}">Reject</button></div></div>`;
}
function insNotif(){
  const n=attention();
  return insHead(ic('bell'),'Notifications','Live from the background agents')+`<div class="insp-b">${n.length?`<div class="list">${n.map((a,i)=>`<div style="cursor:pointer" data-act="att" data-i="${i}"><div class="cell2"><b>${esc(a.t)}</b><small>${esc(a.m)}</small></div>${ic('chev','s')}</div>`).join('')}</div>`:'<div class="dim2">You are all caught up.</div>'}</div>`;
}
function renderInspector(){
  const el=$('#insp'),x=state.ins;
  if(!x){el.classList.remove('open');el.setAttribute('aria-hidden','true');$('#scrim').classList.remove('on');return}
  const sc=$('.insp-b',el)?$('.insp-b',el).scrollTop:0;
  el.innerHTML={res:insRes,staff:insStaff,doc:insDoc,hist:insHist,q:insQ,notif:insNotif,inc:insInc}[x.kind](x);
  el.classList.add('open');el.setAttribute('aria-hidden','false');$('#scrim').classList.add('on');
  const b=$('.insp-b',el);if(b)b.scrollTop=sc;
}

/* ---------- palette ---------- */
const insFor=t=>t.kind==='res'?{kind:'res',id:t.id,tab:t.tab}:t.kind==='staff'?{kind:'staff',id:t.id}:t.kind==='inc'?{kind:'inc',id:t.id}:{kind:'doc',id:t.id};
const pal={q:'',i:0,items:[]};
function palItems(){
  const q=pal.q.trim().toLowerCase(),all=[];
  Object.entries(TITLES).filter(([p])=>(state.role==='client'?CLIENT_NAV:AGENCY_NAV).some(n=>n[0]===p)).forEach(([p,l])=>all.push({g:'Pages',l,s:'',go:{t:'page',p}}));
  RES.forEach(r=>all.push({g:'Residents',l:`Resident ${r.id}`,s:`${H[r.h]} · ${r.room}`,go:{t:'res',id:r.id,tab:'files'}}));
  STAFF.forEach(s=>all.push({g:'Staff',l:s.name,s:`${s.role} · ${H[s.h]}`,go:{t:'staff',id:s.id}}));
  RES.forEach(r=>r.meds.forEach(m=>all.push({g:'Medications',l:m.split(' · ')[0],s:`Resident ${r.id} · ${m.split(' · ')[1]||''}`,go:{t:'res',id:r.id,tab:'meds'}})));
  RES.forEach(r=>r.flags.forEach(f=>all.push({g:'Protocols',l:`${f} protocol`,s:`Resident ${r.id}`,go:{t:'res',id:r.id,tab:'risks'}})));
  return (q?all.filter(a=>(a.l+' '+a.s).toLowerCase().includes(q)):all.filter(a=>a.g==='Pages'||a.g==='Residents').slice(0,10)).slice(0,12);
}
function palRender(){
  pal.items=palItems();if(pal.i>=pal.items.length)pal.i=0;
  let g='',h='';
  pal.items.forEach((a,k)=>{if(a.g!==g){g=a.g;h+=`<div class="pal-g">${g}</div>`}h+=`<button class="pal-i ${k===pal.i?'on':''}" role="option" data-act="pal-go" data-k="${k}"><span>${esc(a.l)}</span><small>${esc(a.s)}</small></button>`});
  $('#pall').innerHTML=h||'<div class="pal-empty">No matches</div>';
  const on=$('#pall .on');if(on)on.scrollIntoView({block:'nearest'});
}
function palOpen(){pal.q='';pal.i=0;$('#pal').hidden=false;$('#palq').value='';palRender();$('#palq').focus()}
function palClose(){$('#pal').hidden=true}
function palGo(a){
  palClose();const g=a.go;
  if(g.t==='page'){nav(g.p)}else if(g.t==='res'){openIns({kind:'res',id:g.id,tab:g.tab})}else{openIns({kind:'staff',id:g.id})}
}

/* ---------- core ---------- */
function nav(p){state.page=p;state.ins=null;state.menu=false;render();sessionEl().scrollTop=0}
function render(){
  const sc=sessionEl().scrollTop,mg=$('.msgs')?$('.msgs').scrollTop:0;
  $('#side').innerHTML=sideHTML();$('#side').classList.toggle('open',state.menu);
  $('#top').innerHTML=topHTML();$('#view').innerHTML=PAGES[state.page]();
  renderInspector();renderTour();sessionEl().scrollTop=sc;const m=$('.msgs');if(m)m.scrollTop=m.scrollHeight||mg;
}
function pick(tg){target=tg;const f=$('#filein');f.value='';f.click()}
$('#filein').addEventListener('change',e=>{const f=e.target.files[0];if(f&&target)handleFile(f,target)});
const parseDrop=s=>{if(!s)return null;const p=s.split(':');return p[0]==='track'?{kind:'track',id:p[1]}:p[0]==='care'?{kind:'care',id:p[1],i:+p[2]}:null};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,i=el.dataset.i;
  switch(a){
    case'nav':nav(id);break;
    case'role':state.role=id;state.page=id==='client'?'dashboard':'control';state.ins=null;state.menu=false;render();break;
    case'house':state.house=id;render();break;
    case'house-open':state.house=id;nav('residents');break;
    case'theme':{const d=document.documentElement,dark=d.dataset.theme==='dark'||(!d.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);d.dataset.theme=dark?'light':'dark';try{localStorage.setItem('wardwell-theme',d.dataset.theme)}catch(x){}render();break}
    case'menu':state.menu=!state.menu;render();break;
    case'scrim':if(state.menu){state.menu=false;render()}else closeIns();break;
    case'bell':openIns({kind:'notif'});break;
    case'close':closeIns();break;
    case'ins-back':state.ins=state.prevIns;state.prevIns=null;render();break;
    case'tab':state.ins={...state.ins,tab:id};render();break;
    case'open-res':openIns({kind:'res',id});break;
    case'open-staff':openIns({kind:'staff',id});break;
    case'open-doc':openIns({kind:'doc',id});break;
    case'open-q':openIns({kind:'q',id});break;
    case'att':{const x=(state.ins&&state.ins.kind==='notif'?attention():state.page==='dashboard'?attention():attention())[+i];if(x){const t=x.a;state.ins=null;openIns(insFor(t))}break}
    case'finding':{const x=findings()[+i];if(x){const t=x.a;openIns(insFor(t))}break}
    case'resview':state.resView=id;render();break;
    case'trktype':state.trkType=id;render();break;
    case'sev':state.sev=id;render();break;
    case'trk-upload':pick({kind:'track',id});break;
    case'care-upload':pick({kind:'care',id,i:+i});break;
    case'trk-hist':openIns({kind:'hist',src:'track',id});break;
    case'care-hist':openIns({kind:'hist',src:'care',id,i:+i});break;
    case'trk-arch':{const t=track.find(q=>q.id===id);const was=t.st;t.st='archived';if(state.ins&&state.ins.kind!=='res')state.ins=null;act('Facility staff',`Archived ${t.type} for Resident ${t.res}.`,'','archive');render();toast(`Archived ${t.type} for ${t.res}`,{icon:'archive',action:{label:'Undo',fn:()=>{t.st=was;ACT.shift();render()}}});break}
    case'care-arch':{const c=care[id][+i];const was=c.st;c.st='arch';render();toast(`Archived ${DOCS[+i]} for ${id}`,{icon:'archive',action:{label:'Undo',fn:()=>{c.st=was;render()}}});break}
    case'care-restore':{const c=care[id][+i];c.st=c.prev==='arch'?'o':c.prev;render();break}
    case'restore':toast(`Restored v${el.dataset.v} as the current version`,{icon:'history'});break;
    case'demo':{const rows=trackRows().filter(t=>t.st==='missing'||t.st==='rejected');const row=rows[0]||trackRows()[0];if(!row)break;const slug=row.type.replace(' ','');handleFile({name:id==='good'?`${slug}_${row.res}_2026-09.pdf`:`${slug}_${row.res}_2026-09_unsigned.pdf`},{kind:'track',id:row.id});break}
    case'harm':state.harm=id;render();break;
    case'goharm':state.harm=id;state.house='all';nav('harmonizer');break;
    case'sync':{const n=syncRes(id);if(n){toast(`Synced ${n} discrepancies for ${id} across the care documents`,{icon:'merge'})}render();break}
    case'remind':{const s=STAFF.find(q=>q.id===id);act('Credential Tracker',`Sent a reminder to ${s.name} by SMS and email.`,'w','bell');toast(`Reminder sent to ${s.name} by SMS and email`,{icon:'bell'});render();break}
    case'approve':{const q=QUEUE.find(a=>a.id===id);if(!q)break;QUEUE=QUEUE.filter(a=>a.id!==id);let msg=`Approved draft for ${q.res} at ${q.client}`;if(q.sync){const n=syncRes(q.sync);msg=n?`Approved and deployed. ${n} discrepancies synced for ${q.res}`:`Approved and deployed for ${q.res}`}else act('Compliance Team',`Approved a ${q.type.toLowerCase()} for ${q.client}.`,'g','check');if(state.ins&&state.ins.kind==='q')state.ins=null;render();toast(msg);break}
    case'reject':{const q=QUEUE.find(a=>a.id===id);if(!q)break;QUEUE=QUEUE.filter(a=>a.id!==id);if(state.ins&&state.ins.kind==='q')state.ins=null;render();toast(`Rejected draft for ${q.res}. Sent back to the agent`,{icon:'x'});break}
    case'open-prof':state.resId=id;state.page='resident';state.ins=null;state.menu=false;render();sessionEl().scrollTop=0;break;
    case'marres':state.marRes=id;render();break;
    case'marres-open':state.marRes=id;state.house='all';nav('meds');break;
    case'open-inc':openIns({kind:'inc',id});break;
    case'inc-accept':acceptInc(id);break;
    case'inc-return':{const x=INC.find(q=>q.id===id);INC=INC.filter(q=>q.id!==id);state.ins=null;act('Compliance Team',`Sent ${x.doc} v${x.ver} for Resident ${x.res} back to ${CMS[x.cm].name} with questions.`,'w','send');render();toast(`Sent back to ${CMS[x.cm].name}`,{icon:'send'});break}
    case'inc-log':simIncoming();break;
    case'tour-start':tourGo(0);break;
    case'tour-next':tourGo(state.tour+1);break;
    case'tour-back':tourGo(state.tour-1);break;
    case'tour-close':state.tour=null;render();break;
    case'ask':ask(el.dataset.q);break;
    case'pal':palOpen();break;
    case'pal-go':palGo(pal.items[+el.dataset.k]);break;
    case'toast-act':{const f=TFN[id];if(f)f();el.closest('.toast').remove();break}
  }
});
document.addEventListener('submit',e=>{if(e.target.id==='askf'){e.preventDefault();const v=$('#askq').value.trim();if(v){$('#askq').value='';ask(v)}}});
$('#palq').addEventListener('input',e=>{pal.q=e.target.value;pal.i=0;palRender()});
$('#pal').addEventListener('mousedown',e=>{if(e.target.id==='pal')palClose()});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#pal').hidden?palOpen():palClose();return}
  if(!$('#pal').hidden){
    if(e.key==='Escape'){palClose()}
    else if(e.key==='ArrowDown'){e.preventDefault();pal.i=Math.min(pal.i+1,pal.items.length-1);palRender()}
    else if(e.key==='ArrowUp'){e.preventDefault();pal.i=Math.max(pal.i-1,0);palRender()}
    else if(e.key==='Enter'){e.preventDefault();if(pal.items[pal.i])palGo(pal.items[pal.i])}
    return;
  }
  if(e.key==='Escape'){if(state.menu){state.menu=false;render()}else if(state.ins)closeIns()}
});
/* drag and drop */
let overEl=null;
document.addEventListener('dragover',e=>{
  e.preventDefault();const z=e.target.closest&&e.target.closest('[data-drop]');
  if(overEl&&overEl!==z)overEl.classList.remove('over','drag');
  if(z){overEl=z;z.classList.add(z.tagName==='TR'?'drag':'over')}
});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget&&overEl){overEl.classList.remove('over','drag');overEl=null}});
document.addEventListener('drop',e=>{
  e.preventDefault();const z=e.target.closest&&e.target.closest('[data-drop]');
  if(overEl){overEl.classList.remove('over','drag');overEl=null}
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;
  const tg=z?parseDrop(z.dataset.drop):null;
  if(!z&&state.page!=='tracking'){toast('Drop files on the Monthly tracking page or on a row',{icon:'alert'});return}
  handleFile(f,tg);
});

try{const t=localStorage.getItem('wardwell-theme');if(t)document.documentElement.dataset.theme=t}catch(x){}
render();
</script>
